<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Manajemen Data & Berkas Siswa</title>
  
  <!-- Tailwind CSS CDN untuk styling spinner -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
  </style>
</head>
<body class="relative flex items-center justify-center">

  <!-- Loading State Indicator saat GAS pertama kali dimuat -->
  <div id="loader" class="absolute z-0 flex flex-col items-center justify-center space-y-3 text-slate-500">
    <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-xs font-semibold tracking-wide">Memuat Sistem Berkas Siswa...</p>
  </div>

  <!-- GANTI URL SRC DI BAWAH DENGAN WEB APP URL GAS ANDA -->
  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbx_6e6mSEYqpa8uFl7OAERVXfzXwJFg6WwC7cF3YeggsVm6Aq2J7yTDpH2sRpTyuWIE/exec" 
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
    onload="document.getElementById('loader').style.display='none';"
  ></iframe>

</body>
</html>
